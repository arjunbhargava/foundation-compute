# The compute list: the hardware profiles a job file may name, the spend
# limits the admin policy enforces, and the account's EC2 vCPU quotas, which
# compute-server:status reports but which limit nothing. The admin policy reads
# whatever this file says, so an instance type is added or enabled here, not
# in code. docs/compute-jobs.md, "Hardware profiles" and "Spend limits",
# explains each field; limits.v1.schema.json and limits.py validate them. An
# entry marked &name is reused below as *name, so its facts and price are
# written once.
#
# Prices are AWS's on-demand Linux list prices in us-east-1, in USD per hour,
# checked on 2026-10-15 at https://instances.vantage.sh. A price may round up
# but never down, so a job's ceiling never understates. A spot entry is priced
# at its on-demand price, which bounds what spot costs.
schema_version: 1
# The starting spend limits, and the defaults whenever the owner hasn't set
# plugins.compute_jobs on the server's dashboard config page, which overrides
# them on the next launch with no release. docs/compute-jobs.md, "Spend
# limits", says how. daily_cap_usd must be >= max_burn_usd_per_hour.
spend:
  # The most the running jobs and the new one may cost an hour at list price:
  # two 2-node gpu-sim jobs ($120.52), one gpu-small and one 3-node cpu job.
  max_burn_usd_per_hour: 125
  # The most the ceilings of the jobs launched in any 24 hours may add up to:
  # 24 x max_burn_usd_per_hour.
  daily_cap_usd: 3000
quotas: # the account's applied vCPU quotas in us-east-1, read 2026-10-15
  standard_on_demand: 1152 # Running On-Demand Standard (A, C, D, H, I, M, R, T, Z) instances
  g_vt_on_demand: 768 # Running On-Demand G and VT instances
  p_on_demand: 768 # Running On-Demand P instances
  # PLACEHOLDER: the three spot quotas are unknown until the owner reads them;
  # 0 assumes nothing.
  standard_spot: 0 # All Standard (A, C, D, H, I, M, R, T, Z) Spot Instance Requests
  g_vt_spot: 0 # All G and VT Spot Instance Requests
  p_spot: 0 # All P Spot Instance Requests
profiles:
  cpu:
    max_runtime_minutes: 1440
    entries: # tried in order
      # Spot stays off while the Standard spot quota is unknown.
      - instance_type: m7i.4xlarge
        quota: standard_on_demand
        spot_quota: null
        accelerator: null
        gpus_per_node: 0
        gpu_memory_gb: null
        vcpus: 16
        usd_per_hour: 0.8064
        max_nodes: 3
        spot_allowed: false
        enabled: true
  gpu-small:
    max_runtime_minutes: 1440
    entries:
      - instance_type: g6.xlarge
        quota: g_vt_on_demand
        spot_quota: g_vt_spot
        accelerator: L4
        gpus_per_node: 1
        gpu_memory_gb: 24
        vcpus: 4
        usd_per_hour: 0.8048
        max_nodes: 1
        spot_allowed: true
        enabled: true
      - instance_type: g6e.xlarge
        quota: g_vt_on_demand
        spot_quota: g_vt_spot
        accelerator: L40S
        gpus_per_node: 1
        gpu_memory_gb: 48
        vcpus: 4
        usd_per_hour: 1.861
        max_nodes: 1
        spot_allowed: true
        enabled: true
      - instance_type: g4dn.xlarge
        quota: g_vt_on_demand
        spot_quota: g_vt_spot
        accelerator: T4
        gpus_per_node: 1
        gpu_memory_gb: 16
        vcpus: 4
        usd_per_hour: 0.526
        max_nodes: 1
        spot_allowed: true
        enabled: true
  gpu-sim:
    max_runtime_minutes: 1440
    entries:
      - &g6e_48xlarge
        instance_type: g6e.48xlarge
        quota: g_vt_on_demand
        spot_quota: g_vt_spot
        accelerator: L40S
        gpus_per_node: 8
        gpu_memory_gb: 48
        vcpus: 192
        usd_per_hour: 30.13118
        max_nodes: 2
        spot_allowed: true
        enabled: true
      - instance_type: g6e.12xlarge
        quota: g_vt_on_demand
        spot_quota: g_vt_spot
        accelerator: L40S
        gpus_per_node: 4
        gpu_memory_gb: 48
        vcpus: 48
        usd_per_hour: 10.49264
        max_nodes: 2
        spot_allowed: true
        enabled: true
  gpu-train:
    max_runtime_minutes: 1440
    entries:
      - *g6e_48xlarge
  gpu-sim-large: # disabled until the owner chooses; 4 nodes cost $120.52 an hour
    max_runtime_minutes: 1440
    entries:
      - <<: *g6e_48xlarge
        spot_quota: null
        max_nodes: 4
        spot_allowed: false
        enabled: false
  gpu-train-large: # disabled until the owner chooses; 2 p5 nodes cost $110.08 an hour
    max_runtime_minutes: 1440
    entries:
      - instance_type: p5.48xlarge
        quota: p_on_demand
        spot_quota: null
        accelerator: H100
        gpus_per_node: 8
        gpu_memory_gb: 80
        vcpus: 192
        usd_per_hour: 55.04
        max_nodes: 2
        spot_allowed: false
        enabled: false
      - instance_type: p4d.24xlarge
        quota: p_on_demand
        spot_quota: null
        accelerator: A100
        gpus_per_node: 8
        gpu_memory_gb: 40
        vcpus: 96
        usd_per_hour: 21.96
        max_nodes: 2
        spot_allowed: false
        enabled: false
