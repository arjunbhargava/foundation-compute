[project]
name = "compute-jobs"
version = "0.1.0"
description = "Code that runs inside a compute job: the job file, progress reports, the run wrapper, and fan-out."
# Job code imports this library on the project's own Python, not the client's
# 3.13.
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.114",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.14.0"]
build-backend = "uv_build"

# The root pyproject.toml's tool settings apply here, except these, which
# .github/scripts/mutate.sh needs when it runs mutmut in this directory.
[tool.pytest]
addopts = ["-n", "auto", "--doctest-modules"]
testpaths = ["src", "tests"]
strict = true
filterwarnings = ["error"]

[tool.mutmut]
pytest_add_cli_args = ["-n", "0"]

[dependency-groups]
dev = [
    "boto3-stubs-lite[s3,sts]>=1.43.114",
    "jsonschema>=4.26.0",
    "moto[s3]>=5.2.4",
]
