# Opens PRs that update pinned dependencies, including the commit each action
# is pinned to. Each language task adds an entry for its package ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Waits a week after a release before proposing it, so a compromised
    # release is more likely to be caught first. Security updates don't wait.
    cooldown:
      default-days: 7
  # The docs build's tools in docs/, and the three Python distributions: the
  # root and its uv workspace members, which share the root's uv.lock.
  - package-ecosystem: uv
    directories: [/, /docs, /lib, /compute/server/admin_policy]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The job image's base image and uv, pinned by digest in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
